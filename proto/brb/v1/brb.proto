edition = "2024";

package brb.v1;
option go_package = "github.com/alkval/gorums-brb/proto/brb/v1;brbv1";
option features.field_presence = IMPLICIT;
option features.enforce_naming_style = STYLE_LEGACY;

import "google/protobuf/empty.proto";
import "gorums.proto";

// Bracha transports Bracha and the experimental optimistic variant.
// Each phase is a one-way multicast, including to the sending process itself.
service Bracha {
  rpc Propose(PhaseMessage) returns (google.protobuf.Empty) {
    option (gorums.multicast) = true;
  }

  rpc Echo(PhaseMessage) returns (google.protobuf.Empty) {
    option (gorums.multicast) = true;
  }

  rpc Ready(PhaseMessage) returns (google.protobuf.Empty) {
    option (gorums.multicast) = true;
  }

  rpc QEcho(PhaseMessage) returns (google.protobuf.Empty) {
    option (gorums.multicast) = true;
  }
}

// BroadcastID scopes protocol state to one value proposed by one origin.
message BroadcastID {
  uint32 origin = 1;
  uint64 sequence = 2;
}

// PhaseMessage carries the value associated with a broadcast instance.
// The sender is the peer identity reported by Gorums, not a message field.
message PhaseMessage {
  // Field 3 held a self-declared sender ID. Every run restarts the whole group,
  // so mixed versions are unsupported.
  reserved 3;
  reserved sender;

  BroadcastID id = 1;
  bytes value = 2;
  // All members must run the same variant. False selects ordinary Bracha.
  bool optimistic = 4;
}
