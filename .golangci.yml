version: "2"
run:
  timeout: 5m
linters:
  # Based on Gorums' diagnostic checks. Cleanup errors are handled as needed.
  disable:
    - errcheck
  enable:
    - asasalint
    - bidichk
    - durationcheck
    - errorlint
    - forcetypeassert
    - makezero
    - nilerr
    - nilnesserr
    - nolintlint
    - reassign
    - unconvert
    - wastedassign
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      - path: _test\.go
        linters: [errorlint, forcetypeassert]
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
